name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"

  # Azure OIDC authentication
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: 0f736765-2a41-4713-a5cc-f671f029ef85
  ARM_TENANT_ID: 1abac9aa-2d3d-43ce-a02b-a0088d317630
  ARM_SUBSCRIPTION_ID: c0fefeb2-eca9-4c42-a650-6e08b544f0a8


jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================

  terraform-plan:

    name: Terraform Format Validate Plan

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -------------------------------------------------------
      # Azure Login using OIDC
      # -------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}


      # -------------------------------------------------------
      # Terraform Format Check
      #
      # Modular is the Terraform project directory.
      # This checks all .tf files recursively.
      # -------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: Week-2/Terraform_Recap/day_03/Modular


      # -------------------------------------------------------
      # Terraform Init
      #
      # Dev is the Terraform root module.
      # -------------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


      # -------------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


      # -------------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================

  terraform-apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    # Apply only after plan succeeds
    needs: terraform-plan

    # Apply only on push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # GitHub Environment
    # Required reviewers can be configured here.
    environment:
      name: production

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Setup Terraform
      # -------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -------------------------------------------------------
      # Azure Login using OIDC
      # -------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}


      # -------------------------------------------------------
      # Terraform Format Check
      # -------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: Week-2/Terraform_Recap/day_03/Modular


      # -------------------------------------------------------
      # Terraform Init
      # -------------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


      # -------------------------------------------------------
      # Terraform Validate
      # -------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


      # -------------------------------------------------------
      # Terraform Plan
      # -------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev


      # -------------------------------------------------------
      # Terraform Apply
      # -------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: Week-2/Terraform_Recap/day_03/Modular/ENV/Dev