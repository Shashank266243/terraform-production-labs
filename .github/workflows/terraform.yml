name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"

  # Azure OIDC authentication
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: 0f736765-2a41-4713-a5cc-f671f029ef85
  ARM_TENANT_ID: 1abac9aa-2d3d-43ce-a02b-a0088d317630
  ARM_SUBSCRIPTION_ID: c0fefeb2-eca9-4c42-a650-6e08b544f0a8

jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================

  terraform-plan:

    name: Terraform Format Validate Plan
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}


      # -----------------------------------------------------
      # Terraform Format
      #
      # Run from repository root so all Terraform files
      # under ENV and Module are checked recursively.
      # -----------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # -----------------------------------------------------
      # Terraform Init
      #
      # ENV/Dev is the root Terraform module.
      # -----------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: ENV/Dev


      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: ENV/Dev


      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: ENV/Dev


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================

  terraform-apply:

    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}


      # -----------------------------------------------------
      # Terraform Format
      # -----------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: ENV/Dev


      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: ENV/Dev


      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: ENV/Dev


      # -----------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ENV/Dev