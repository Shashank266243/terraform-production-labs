name: Terraform CI-CD

on:
  # ---------------------------------------------------------
  # Run when code is pushed to feature branches or main
  # ---------------------------------------------------------
  push:
    branches:
      - "feature/**"
      - main

  # ---------------------------------------------------------
  # Run when PR is created/updated against main
  # ---------------------------------------------------------
  pull_request:
    branches:
      - main


# -----------------------------------------------------------
# GitHub Actions permissions
# -----------------------------------------------------------

permissions:
  id-token: write
  contents: read


# -----------------------------------------------------------
# Global environment variables
# -----------------------------------------------------------

env:
  TF_VERSION: "1.9.8"

  # Azure OIDC authentication
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: 0f736765-2a41-4713-a5cc-f671f029ef85
  ARM_TENANT_ID: 1abac9aa-2d3d-43ce-a02b-a0088d317630
  ARM_SUBSCRIPTION_ID: c0fefeb2-eca9-4c42-a650-6e08b544f0a8


jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================

  terraform-plan:

    name: Terraform Format Validate Plan

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 0f736765-2a41-4713-a5cc-f671f029ef85
          tenant-id: 1abac9aa-2d3d-43ce-a02b-a0088d317630
          subscription-id: c0fefeb2-eca9-4c42-a650-6e08b544f0a8


      # -----------------------------------------------------
      # Terraform Format
      #
      # Run from Modular root so Dev/Prod/QA/Module
      # Terraform files are checked recursively.
      # -----------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: Week-2/Terraform_Recap/day_03/Modular


      # -----------------------------------------------------
      # Terraform Init
      #
      # Dev is the ROOT MODULE.
      # -----------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================

  terraform-apply:

    name: Terraform Apply

    runs-on: ubuntu-latest

    # Apply only after plan job succeeds
    needs: terraform-plan

    # Apply only when code is pushed to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'


    # -------------------------------------------------------
    # GitHub Environment
    #
    # If "production" environment has required reviewers,
    # GitHub will wait for approval before this job starts.
    # -------------------------------------------------------

    environment:
      name: production


    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: 0f736765-2a41-4713-a5cc-f671f029ef85
          tenant-id: 1abac9aa-2d3d-43ce-a02b-a0088d317630
          subscription-id: c0fefeb2-eca9-4c42-a650-6e08b544f0a8


      # -----------------------------------------------------
      # Terraform Format
      # -----------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: Week-2/Terraform_Recap/day_03/Modular


      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------

      - name: Terraform Validate
        run: terraform validate
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------

      - name: Terraform Plan
        run: terraform plan
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev


      # -----------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: Week-2/Terraform_Recap/day_03/Modular/Dev